<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="340" viewBox="0 0 1200 340"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">document-format</title>
  <desc id="hero-desc">A Claude Code skill named word-expert-formatting that turns Markdown, TXT, or an existing .docx into a spec-compliant Chinese formal Word document, shown as a raw text page transforming into a numbered, sealed, justified page.</desc>

  <rect width="1200" height="340" rx="20" fill="#F6F3EC"/>

  <g id="left-title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="64" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="3" fill="#8B8577">CLAUDE CODE SKILL</text>

    <text x="64" y="130" font-size="58" font-weight="800" letter-spacing="-1" fill="#24365C">document-format</text>

    <text x="64" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23" fill="#2A2A26">word-expert-formatting</text>

    <text x="64" y="204" font-size="22" fill="#2A2A26">Turn Markdown, TXT, or an existing .docx</text>
    <text x="64" y="230" font-size="22" fill="#2A2A26">into a spec-compliant formal Word document.</text>

    <g id="numbering-badges" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700">
      <rect x="64" y="252" width="36" height="30" rx="15" fill="none" stroke="#24365C" stroke-width="1.5"/>
      <text x="82" y="272" font-size="18" fill="#24365C" text-anchor="middle">1</text>

      <rect x="112" y="252" width="56" height="30" rx="15" fill="none" stroke="#24365C" stroke-width="1.5"/>
      <text x="140" y="272" font-size="18" fill="#24365C" text-anchor="middle">1.1</text>

      <rect x="180" y="252" width="76" height="30" rx="15" fill="none" stroke="#24365C" stroke-width="1.5"/>
      <text x="218" y="272" font-size="18" fill="#24365C" text-anchor="middle">1.1.1</text>
    </g>

    <g id="input-chips" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <rect x="64" y="298" width="48" height="26" rx="13" fill="#EFEAE0" stroke="#8B8577" stroke-width="1"/>
      <text x="88" y="316" font-size="15" fill="#4A473F" text-anchor="middle">.md</text>

      <rect x="120" y="298" width="54" height="26" rx="13" fill="#EFEAE0" stroke="#8B8577" stroke-width="1"/>
      <text x="147" y="316" font-size="15" fill="#4A473F" text-anchor="middle">.txt</text>

      <rect x="182" y="298" width="64" height="26" rx="13" fill="#EFEAE0" stroke="#8B8577" stroke-width="1"/>
      <text x="214" y="316" font-size="15" fill="#4A473F" text-anchor="middle">.docx</text>
    </g>
  </g>

  <line x1="700" y1="40" x2="700" y2="300" stroke="#8B8577" stroke-width="1" opacity="0.3"/>

  <g id="proof-transformation">
    <g id="page-raw">
      <rect x="732" y="46" width="168" height="234" rx="10" fill="#EFEAE0" stroke="#8B8577" stroke-width="1.2"/>
      <g stroke="#2A2A26" stroke-width="5" stroke-linecap="round" opacity="0.5">
        <line x1="750" y1="80" x2="850" y2="80"/>
        <line x1="750" y1="100" x2="872" y2="100"/>
        <line x1="750" y1="120" x2="838" y2="120"/>
