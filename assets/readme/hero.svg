      </g>
      <text x="816" y="304" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="2" fill="#8B8577" text-anchor="middle">RAW</text>
    </g>

    <path d="M 906 163 L 966 163 M 954 153 L 966 163 L 954 173" fill="none" stroke="#A63A2E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <g id="page-docx">
      <rect x="1000" y="46" width="168" height="234" rx="10" fill="#FFFFFF" stroke="#24365C" stroke-width="1.5"/>
      <circle cx="1146" cy="66" r="8" fill="#A63A2E" opacity="0.92"/>

