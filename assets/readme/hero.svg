      <text x="1048" y="123.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#24365C" text-anchor="middle" opacity="0.85">1.1</text>
      <rect x="1072" y="114.5" width="55" height="7" rx="3.5" fill="#24365C" opacity="0.85"/>

      <rect x="1046" y="134" width="40" height="13" rx="6.5" fill="none" stroke="#24365C" stroke-width="1" opacity="0.7"/>
      <text x="1066" y="143.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#24365C" text-anchor="middle" opacity="0.7">1.1.1</text>
      <rect x="1090" y="135.5" width="45" height="6" rx="3" fill="#24365C" opacity="0.7"/>

      <g fill="#2A2A26" opacity="0.32">
        <rect x="1018" y="160" width="134" height="4" rx="2"/>
        <rect x="1018" y="174" width="134" height="4" rx="2"/>
        <rect x="1018" y="188" width="134" height="4" rx="2"/>
        <rect x="1018" y="202" width="134" height="4" rx="2"/>
        <rect x="1018" y="216" width="134" height="4" rx="2"/>
        <rect x="1018" y="230" width="86" height="4" rx="2"/>
      </g>

      <line x1="1018" y1="256" x2="1152" y2="256" stroke="#8B8577" stroke-width="1" opacity="0.4"/>
      <text x="1085" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8B8577" text-anchor="middle">1</text>

      <text x="1084" y="304" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="2" fill="#24365C" text-anchor="middle" font-weight="700">DOCX</text>
    </g>
  </g>

  <text x="732" y="328" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#8B8577">SKILL.md → text_to_docx.py → .docx</text>
